# Re-run the fine-tuning behind Table 1 (f) instead of downloading the released fine-tuned checkpoints.
# Hyperparameters are those of the paper runs. The paper fine-tunes started from an earlier checkpoint of the same
# pretraining run (epoch <= 31, not released), so expect numbers close to, but not identical with, Table 1.
# Run: python scripts/hawkes/fim_benchmark.py --config scripts/hawkes/configs/fim_pp_iclr2026/finetune_table1.yaml
datasets:
  - taxi
  - taobao
  - stackoverflow
  - amazon
  - retweet

checkpoints:
  - FIM4Science/fim-pp

# Evaluation protocol (identical to the runs behind the paper numbers)
task: long_horizon
sampling_method: thinning
context_size: 2000          # first min(2000, |train|) train sequences are the context, identical for every test sequence
inference_size: null        # all test sequences
max_num_events: 100         # truncate context and test sequences to 100 events before the history/horizon split
sample_idx: 0
num_integration_points: 5000
nll_method: monte_carlo
forecast_horizon_size: 20   # N; use 5 or 10 for the appendix tables
num_ensemble_trajectories: 5  # rollouts per test sequence, aggregated to one forecast (mean dt, majority-vote mark)
num_trials: 3               # the paper numbers use 3 trials (seeds 0,1,2); the captions wrongly state 10
base_seed: 0
parallel: 1                 # datasets evaluated concurrently (each run uses one GPU process)
fine_tune: true
finetune_config: configs/train/hawkes/david.yaml
fine_tune_lr: 5e-5
fine_tune_epochs: 15000
finetune_val_every: 500
finetune_max_paths: 2000
finetune_max_events: 100

results_root: results/fim_pp_iclr2026/finetune_table1
