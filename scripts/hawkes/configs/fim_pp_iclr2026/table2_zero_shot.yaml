# Table 2, row FIM-PP (zs): next-event prediction on the EasyTPP Hugging Face datasets (easytpp/taxi, easytpp/taobao).
# Run: python scripts/hawkes/fim_benchmark.py --config scripts/hawkes/configs/fim_pp_iclr2026/table2_zero_shot.yaml
datasets:
  - taxi
  - taobao

checkpoints:
  # Epoch 38 of the pretraining run (the final best-validation checkpoint). Table 1 used epoch 36 (= FIM4Science/fim-pp).
  - FIM4Science/fim-pp-paper-checkpoints/table2-zero-shot

# Evaluation protocol (identical to the runs behind the paper numbers)
task: next_event
sampling_method: thinning
context_size: 2000          # first min(2000, |train|) train sequences are the context
inference_size: null        # all test sequences
max_num_events: 100
sample_idx: 0
num_integration_points: 5000
nll_method: monte_carlo
num_bootstrap_samples: 1000 # the reported +- is the half-width of the 95% bootstrap CI over events (single run)
parallel: 1
fine_tune: false

results_root: results/fim_pp_iclr2026/table2_zero_shot
